<script>
(function () {
  'use strict';

  var KEY = 'shagua-chart-v2';
  var OLD_KEY = 'shagua-chart-v1';

  var DEFAULTS = {
    title: '近一年营收对比',
    xTitle: '季度',
    yTitle: '营业收入（亿元）',
    footnote: '数据来源：公司年报',
    xType: 'auto',
    xText: '第1季度\n第2季度\n第3季度\n第4季度',
    series: [
      { name: '甲公司', text: '12.4\n15.8\n14.2\n21.6' },
      { name: '乙公司', text: '9.8\n11.2\n13.6\n15.1' }
    ],
    type: 'line',
    labels: true,
    grid: true,
    legend: true,
    zero: true,
    negColor: true,
    barMode: 'group',
    palette: 'ink',
    pieColors: {},
    aspect: '16:10',
    font: "'Microsoft YaHei','Segoe UI',sans-serif",
    scale: '3'
  };

  var PALETTE = {
    ink: ['#1F1F1F', '#6B6A66', '#9C9A94', '#C4C2BB', '#8A8880'],
    blue: ['#2F6FD0', '#5B9BE0', '#94BEEE', '#C4DAF5', '#1E4C93'],
    red: ['#C0392B', '#DE7A5F', '#EFB3A2', '#F7D5C9', '#8E2A1F'],
    green: ['#2E7D5B', '#5FA783', '#9DCBB4', '#CFE5D9', '#1C5C41']
  };
  var MULTI = ['#2F6FD0', '#C0392B', '#2E7D5B', '#BA7517', '#7F77DD', '#0F6E56', '#D4537E', '#888780', '#4A6FA5', '#A64B2A'];
  var NEG = '#2E7D5B';
  var INK = '#1F1F1F';
  var GRID = '#ECEAE3';
  var AXIS = '#1F1F1F';
  var MUTED = '#7C7970';

  var state = load();
  var canvas = document.getElementById('canvas');
  var statusEl = document.getElementById('status');
  var toastEl = document.getElementById('toast');
  var listEl = document.getElementById('seriesList');
  var countEl = document.getElementById('seriesCount');
  var lastSvg = '';
  var lastData = null;
  var lastW = 800, lastH = 500;

  function cloneSeries(arr) {
    return arr.map(function (s) {
      var o = { name: s.name, text: s.text };
      if (s.color) { o.color = s.color; }
      return o;
    });
  }

  function load() {
    var s = {};
    var k;
    for (k in DEFAULTS) { s[k] = DEFAULTS[k]; }
    s.series = cloneSeries(DEFAULTS.series);
    s.pieColors = {};
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) {
        var old = localStorage.getItem(OLD_KEY);
        if (old) {
          var o = JSON.parse(old);
          o.series = [{ name: o.yTitle || '系列1', text: o.yText || '' }];
          raw = JSON.stringify(o);
        }
      }
      if (raw) {
        var st = JSON.parse(raw);
        for (k in DEFAULTS) { if (k !== 'pieColors' && st[k] !== undefined) { s[k] = st[k]; } }
        if (st.pieColors) { for (var pc in st.pieColors) { s.pieColors[pc] = st.pieColors[pc]; } }
        if (!s.series || !s.series.length) { s.series = cloneSeries(DEFAULTS.series); }
        s.series = s.series.map(function (o2) {
          var it = { name: o2.name || '系列', text: o2.text || '' };
          if (o2.color) { it.color = o2.color; }
          return it;
        });
      }
    } catch (e) {}
    return s;
  }

  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 300);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toHalf(s) {
    return String(s).replace(/[\uFF01-\uFF5E]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    }).replace(/\u3000/g, ' ');
  }

  function textW(s, size) {
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      w += (c > 0x2E80 && c < 0x9FFF) || (c >= 0xFF00 && c <= 0xFFEF) ? size : size * 0.56;
    }
    return w;
  }

  function parseValue(raw) {
    var s = String(raw).trim();
    if (!s) { return { v: null, pct: false }; }
    s = toHalf(s);
    var pct = false;
    if (s.indexOf('%') >= 0) { pct = true; s = s.replace(/%/g, ''); }
    s = s.replace(/[¥$€£￥]/g, '').replace(/元|人民币|美元/g, '').trim();
    var mult = 1;
    if (s.indexOf('亿') >= 0) { mult = 1e8; s = s.replace(/亿/g, ''); }
    else if (s.indexOf('万') >= 0) { mult = 1e4; s = s.replace(/万/g, ''); }
    var prev;
    do {
      prev = s;
      s = s.replace(/(\d),(\d{3})(?=\D|$)/g, '$1$2');
      s = s.replace(/(\d),(\d{3})\./g, '$1$2.');
    } while (s !== prev);
    s = s.replace(/[\s,]/g, '');
    if (s === '' || s === '-' || s === '.') { return { v: null, pct: pct }; }
    var v = parseFloat(s);
    if (!isFinite(v)) { return { v: null, pct: pct }; }
    return { v: v * mult, pct: pct };
  }

  function splitLines(t) {
    return String(t == null ? '' : t)
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (l) { return l.replace(/\u3000/g, ' ').trim(); })
      .filter(function (l) { return l !== ''; });
  }

  function niceNum(range, round) {
    var exp = Math.floor(Math.log10(range));
    var f = range / Math.pow(10, exp);
    var nf;
    if (round) { nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10; }
    else { nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10; }
    return nf * Math.pow(10, exp);
  }

  function niceScale(min, max, want) {
    if (!(max > min)) { max = min + 1; }
    var range = niceNum(max - min, false);
    var step = niceNum(range / (want - 1), true);
    var nmin = Math.floor(min / step) * step;
    var nmax = Math.ceil(max / step) * step;
    var out = [];
    var guard = 0;
    for (var v = nmin; v <= nmax + step * 0.5 && guard < 60; v += step) {
      out.push(Math.round(v * 1e6) / 1e6);
      guard++;
    }
    return { min: nmin, max: nmax, ticks: out, step: step };
  }

  function trim(n) {
    return String(Math.round(n * 100) / 100);
  }

  function fmtNum(v) {
    var a = Math.abs(v);
    if (a >= 1e8) { return trim(v / 1e8) + '亿'; }
    if (a >= 1e4) { return trim(v / 1e4) + '万'; }
    return trim(v);
  }

  function dims() {
    if (state.aspect === '1:1') { return { w: 800, h: 800 }; }
    if (state.aspect === '4:3') { return { w: 800, h: 600 }; }
    return { w: 800, h: 500 };
  }

  function colorOf(si) {
    var s = state.series[si];
    if (s && s.color) { return s.color; }
    var arr = PALETTE[state.palette] || PALETTE.ink;
    return arr[si % arr.length];
  }

  function pieColor(i) {
    var c = state.pieColors && state.pieColors[i];
    return c || MULTI[i % MULTI.length];
  }

  function isLight(hex) {
    var h = String(hex).replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 168;
  }

  function wrapText(text, maxW, fs) {
    var out = [];
    String(text).replace(/\r\n?/g, '\n').split('\n').forEach(function (para) {
      if (!para.trim()) { return; }
      var line = '';
      for (var i = 0; i < para.length; i++) {
        var ch = para.charAt(i);
        if (line && textW(line + ch, fs) > maxW) { out.push(line); line = ch; }
        else { line += ch; }
      }
      if (line) { out.push(line); }
    });
    return out;
  }

  function buildData() {
    var warns = [];
    var xLines = splitLines(state.xText);
    var raw = state.series.map(function (s, si) {
      return { name: (s.name || '系列').trim() || '系列', vals: splitLines(s.text).map(parseValue), si: si };
    });
    var active = raw.filter(function (s) { return s.vals.length > 0; });
    if (!active.length) { return { labels: [], xNums: [], series: [], warns: [], empty: true, numericX: false }; }

    var m0 = active[0].vals.length;
    active.forEach(function (s) { m0 = Math.min(m0, s.vals.length); });
    var m = xLines.length ? Math.min(m0, xLines.length) : m0;

    active.forEach(function (s) {
      if (s.vals.length !== m) { warns.push('「' + s.name + '」有 ' + s.vals.length + ' 个值，按前 ' + m + ' 个对齐'); }
    });
    if (xLines.length && xLines.length !== m) {
      warns.push('横轴 ' + xLines.length + ' 项，按前 ' + m + ' 项对齐');
    }

    var labels = [], xNums = [], badY = 0;
    for (var i = 0; i < m; i++) {
      labels.push(xLines.length ? xLines[i].replace(/^["']|["']$/g, '') : String(i + 1));
      xNums.push(xLines.length ? parseValue(xLines[i]).v : i + 1);
    }

    var numericX = false;
    if (state.xType === 'num') {
      numericX = xNums.every(function (v) { return v !== null; });
      if (!numericX) { warns.push('横轴含非数字值，已改用分类轴'); }
    } else if (state.xType === 'auto') {
      numericX = state.type === 'scatter' && xNums.every(function (v) { return v !== null; });
    }

    var series = active.map(function (s) {
      var values = s.vals.slice(0, m).map(function (o) { return o.v; });
      var bad = values.filter(function (v) { return v === null; }).length;
      if (bad) { badY += bad; }
      return { name: s.name, si: s.si, color: colorOf(s.si), values: values, bad: bad };
    });
    if (badY) { warns.push('跳过 ' + badY + ' 个无法识别的数值'); }
    if (state.labels && series.length > 4) { warns.push('系列较多，数据标签可能拥挤'); }
    if (state.type === 'pie' && series.length > 1) { warns.push('饼图只使用第一个系列'); }
    if (state.type === 'pie' && series.some(function (s) { return s.values.some(function (v) { return v !== null && v < 0; }); })) {
      warns.push('饼图不支持负值，按绝对值计算');
    }

    return { labels: labels, xNums: xNums, series: series, warns: warns, empty: false, numericX: numericX };
  }

  function svgOpen(W, H) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" font-family="' + esc(state.font) + '">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>';
  }

  function emptySvg() {
    var d = dims();
    return svgOpen(d.w, d.h) +
      '<text x="' + d.w / 2 + '" y="' + d.h / 2 + '" text-anchor="middle" font-size="14" fill="#B0ADA4">在左侧填入数据即可出图</text>' +
      '<text x="' + d.w / 2 + '" y="' + (d.h / 2 + 24) + '" text-anchor="middle" font-size="12" fill="#C6C3BA">横轴与纵轴按行一一对应</text>' +
      '</svg>';
  }

  function packLegend(items, maxW, fs) {
    var rows = [], row = [], w = 0;
    items.forEach(function (it) {
      var iw = 20 + textW(it.name, fs) + 18;
      if (row.length && w + iw > maxW) { rows.push({ items: row, w: w }); row = []; w = 0; }
      row.push(it);
      w += iw;
    });
    if (row.length) { rows.push({ items: row, w: w }); }
    return rows;
  }

  function drawLegend(rows, W, top, type, fs) {
    var out = [];
    rows.forEach(function (r, ri) {
      var x = (W - r.w) / 2;
      var y = top + ri * 20;
      r.items.forEach(function (it) {
        if (type === 'line') {
          out.push('<line x1="' + x.toFixed(1) + '" y1="' + (y - 4).toFixed(1) + '" x2="' + (x + 13).toFixed(1) + '" y2="' + (y - 4).toFixed(1) + '" stroke="' + it.color + '" stroke-width="2.4" data-series="' + it.si + '"/>');
        } else {
          out.push('<rect x="' + x.toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" width="12" height="9" rx="1.5" fill="' + it.color + '" data-series="' + it.si + '"/>');
        }
        out.push('<text x="' + (x + 18).toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + fs + '" fill="' + INK + '" data-series="' + it.si + '">' + esc(it.name) + '</text>');
        x += 20 + textW(it.name, fs) + 18;
      });
    });
    return out.join('');
  }

  function draw() {
    var d = buildData();
    lastData = d;
    hoverKey = '';
    updateStatus(d);
    if (d.empty) {
      lastSvg = emptySvg();
      lastW = dims().w; lastH = dims().h;
      canvas.innerHTML = lastSvg;
      return;
    }
    var base = dims();
    var noteLines = state.footnote.trim() ? wrapText(state.footnote.trim(), base.w - 56, 11) : [];
    var noteH = noteLines.length ? noteLines.length * 15 + 16 : 0;
    var W = base.w, H = base.h + noteH;
    lastW = W; lastH = H;

    if (state.type === 'pie') {
      lastSvg = drawPie(d, W, H, noteLines, noteH);
      canvas.innerHTML = lastSvg;
      return;
    }
    lastSvg = drawXY(d, W, H, noteLines, noteH);
    canvas.innerHTML = lastSvg;
  }

  function noteBlock(noteLines, x0, W, H, noteH) {
    if (!noteLines.length) { return ''; }
    var out = [];
    if (noteH) {
      out.push('<line x1="' + x0 + '" y1="' + (H - noteH + 4) + '" x2="' + (W - 26) + '" y2="' + (H - noteH + 4) + '" stroke="#EFEDE6" stroke-width="1"/>');
    }
    var y = H - noteH + 18;
    noteLines.forEach(function (l) {
      out.push('<text x="' + x0 + '" y="' + y + '" font-size="11" fill="' + MUTED + '">' + esc(l) + '</text>');
      y += 15;
    });
    return out.join('');
  }

  function drawXY(d, W, H, noteLines, noteH) {
    var n = d.labels.length;
    var stack = state.type === 'bar' && state.barMode === 'stack' && d.series.length > 1;
    var dmin = Infinity, dmax = -Infinity;

    if (stack) {
      for (var i = 0; i < n; i++) {
        var pos = 0, neg = 0;
        d.series.forEach(function (s) {
          var v = s.values[i];
          if (v === null || v === undefined) { return; }
          if (v >= 0) { pos += v; } else { neg += v; }
        });
        dmin = Math.min(dmin, neg); dmax = Math.max(dmax, pos);
      }
    } else {
      d.series.forEach(function (s) {
        s.values.forEach(function (v) {
          if (v === null) { return; }
          if (v < dmin) { dmin = v; }
          if (v > dmax) { dmax = v; }
        });
      });
    }
    if (!isFinite(dmin)) { return emptySvg(); }

    if (state.zero) { dmin = Math.min(0, dmin); dmax = Math.max(0, dmax); }
    if (dmin === dmax) { var pad = Math.abs(dmin) * 0.5 || 1; dmin -= pad; dmax += pad; }
    var ys = niceScale(dmin, dmax, 6);

    var fs = 13;
    var hasTitle = !!state.title.trim();
    var hasXT = !!state.xTitle.trim();
    var hasYT = !!state.yTitle.trim();

    var showLegend = state.legend && d.series.length > 1;
    var legendRows = showLegend ? packLegend(d.series, W - 80, 12) : [];
    var legendH = legendRows.length ? legendRows.length * 20 + 12 : 0;

    var padTop = (hasTitle ? 54 : 26) + legendH;
    var yLabelW = 0;
    ys.ticks.forEach(function (t) { yLabelW = Math.max(yLabelW, textW(fmtNum(t), fs)); });
    var padLeft = 24 + yLabelW + (hasYT ? 30 : 0);
    var padRight = 26;

    var xTicks = [], xTickLabels = [], useNumX = d.numericX;
    var xsc = null;
    if (useNumX) {
      var xmin = Math.min.apply(null, d.xNums), xmax = Math.max.apply(null, d.xNums);
      if (xmin === xmax) { xmin -= 1; xmax += 1; }
      xsc = niceScale(xmin, xmax, 6);
      var allInt = d.xNums.every(function (v) { return Math.abs(v - Math.round(v)) < 1e-9; });
      if (allInt && xsc.step < 1) { xsc = niceScale(xmin, xmax, Math.min(8, Math.round((xmax - xmin)) + 1)); }
      xTicks = xsc.ticks;
      xTickLabels = xTicks.map(fmtNum);
    }

    var probeW = W - padLeft - padRight;
    var slotW = probeW / n;
    var maxLW = 0;
    if (useNumX) {
      xTickLabels.forEach(function (t) { maxLW = Math.max(maxLW, textW(t, fs)); });
    } else {
      d.labels.forEach(function (t) { maxLW = Math.max(maxLW, textW(t, fs)); });
    }
    var rotate = useNumX ? (maxLW > probeW / Math.max(xTicks.length, 1) - 6) : (maxLW > slotW - 10);
    var xLabelH = rotate ? Math.min(maxLW * 0.62 + 10, 76) : 20;
    var padBottom = xLabelH + (hasXT ? 30 : 14) + noteH;

    var x0 = padLeft, x1 = W - padRight, y0 = padTop, y1 = H - padBottom;
    var plotW = x1 - x0, plotH = y1 - y0;
    var span = ys.max - ys.min || 1;
    var yOf = function (v) { return y1 - (v - ys.min) / span * plotH; };
    var xOf, xOfCat = function (i) { return x0 + plotW * (i + 0.5) / n; };
    if (useNumX) {
      var xspan = xsc.max - xsc.min || 1;
      xOf = function (v) { return x0 + (v - xsc.min) / xspan * plotW; };
    } else {
      xOf = xOfCat;
    }

    var out = [svgOpen(W, H)];

    if (hasTitle) {
      out.push('<text x="' + (W / 2) + '" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="' + INK + '">' + esc(state.title) + '</text>');
    }
    if (showLegend) {
      out.push(drawLegend(legendRows, W, (hasTitle ? 54 : 26) + 14, state.type, 12));
    }

    if (state.grid) {
      ys.ticks.forEach(function (t) {
        out.push('<line x1="' + x0 + '" y1="' + yOf(t).toFixed(1) + '" x2="' + x1 + '" y2="' + yOf(t).toFixed(1) + '" stroke="' + GRID + '" stroke-width="1"/>');
      });
    }

    out.push('<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="' + AXIS + '" stroke-width="1"/>');
    out.push('<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="' + AXIS + '" stroke-width="1"/>');

    if (ys.min < 0 && ys.max > 0) {
      out.push('<line x1="' + x0 + '" y1="' + yOf(0).toFixed(1) + '" x2="' + x1 + '" y2="' + yOf(0).toFixed(1) + '" stroke="#C9C6BE" stroke-width="1"/>');
    }

    ys.ticks.forEach(function (t) {
      var y = yOf(t);
      out.push('<line x1="' + (x0 - 4) + '" y1="' + y.toFixed(1) + '" x2="' + x0 + '" y2="' + y.toFixed(1) + '" stroke="' + AXIS + '" stroke-width="1"/>');
      out.push('<text x="' + (x0 - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="' + fs + '" fill="' + INK + '">' + esc(fmtNum(t)) + '</text>');
    });

    if (useNumX) {
      var tstep = 1;
      if (rotate) { tstep = Math.ceil((maxLW + 10) / Math.max(probeW / xTicks.length, 1)); if (tstep < 1) { tstep = 1; } }
      out.push('<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="' + AXIS + '" stroke-width="1"/>');
      xTicks.forEach(function (t, i) {
        if (i % tstep !== 0) { return; }
        var x = xOf(t);
        out.push('<line x1="' + x.toFixed(1) + '" y1="' + y1 + '" x2="' + x.toFixed(1) + '" y2="' + (y1 + 4) + '" stroke="' + AXIS + '" stroke-width="1"/>');
        if (rotate) {
          out.push('<text x="' + x.toFixed(1) + '" y="' + (y1 + 17) + '" text-anchor="end" font-size="' + fs + '" fill="' + INK + '" transform="rotate(-35 ' + x.toFixed(1) + ' ' + (y1 + 17) + ')">' + esc(fmtNum(t)) + '</text>');
        } else {
          out.push('<text x="' + x.toFixed(1) + '" y="' + (y1 + 19) + '" text-anchor="middle" font-size="' + fs + '" fill="' + INK + '">' + esc(fmtNum(t)) + '</text>');
        }
      });
    } else {
      var stp = (rotate && slotW < 26) ? Math.ceil(26 / slotW) : 1;
      d.labels.forEach(function (t, i) {
        if (i % stp !== 0) { return; }
        var x = xOfCat(i);
        if (rotate) {
          out.push('<text x="' + x.toFixed(1) + '" y="' + (y1 + 17) + '" text-anchor="end" font-size="' + fs + '" fill="' + INK + '" transform="rotate(-35 ' + x.toFixed(1) + ' ' + (y1 + 17) + ')">' + esc(t) + '</text>');
        } else {
          out.push('<text x="' + x.toFixed(1) + '" y="' + (y1 + 19) + '" text-anchor="middle" font-size="' + fs + '" fill="' + INK + '">' + esc(t) + '</text>');
        }
      });
    }

    if (hasXT) {
      out.push('<text x="' + ((x0 + x1) / 2).toFixed(1) + '" y="' + (H - noteH - 10) + '" text-anchor="middle" font-size="13" fill="' + INK + '">' + esc(state.xTitle) + '</text>');
    }
    if (hasYT) {
      var cy = (y0 + y1) / 2;
      out.push('<text x="22" y="' + cy.toFixed(1) + '" text-anchor="middle" font-size="13" fill="' + INK + '" transform="rotate(-90 22 ' + cy.toFixed(1) + ')">' + esc(state.yTitle) + '</text>');
    }

    var labels = [];
    var baseY = (ys.min <= 0 && ys.max >= 0) ? yOf(0) : (ys.min > 0 ? y1 : y0);
    var order = [];
    for (var q = 0; q < n; q++) { order.push(q); }
    if (useNumX && (state.type === 'line' || state.type === 'scatter')) {
      order.sort(function (a, b) { return d.xNums[a] - d.xNums[b]; });
    }

    if (state.type === 'bar') {
      var bwBase;
      if (useNumX) {
        var sorted = d.xNums.slice().sort(function (a, b) { return a - b; });
        var gap = Infinity;
        for (var g = 1; g < sorted.length; g++) {
          var gd = sorted[g] - sorted[g - 1];
          if (gd > 0 && gd < gap) { gap = gd; }
        }
        if (!isFinite(gap)) { gap = (xsc.max - xsc.min) / n; }
        bwBase = Math.max(gap / (xsc.max - xsc.min) * plotW * 0.72, 2);
      } else {
        bwBase = Math.min(slotW * 0.8, 76);
      }
      var m = d.series.length;
      var bwS = stack ? bwBase : Math.max(bwBase / m, 1);

      for (var i2 = 0; i2 < n; i2++) {
        var xc = useNumX ? xOf(d.xNums[i2]) : xOfCat(i2);
        var posB = 0, negB = 0;
        d.series.forEach(function (s, k) {
          var v = s.values[i2];
          if (v === null || v === undefined) { return; }
          var col = (state.negColor && v < 0) ? NEG : s.color;
          var bx, gw, yTop, yBot;
          if (stack) {
            gw = bwBase;
            bx = xc - gw / 2;
            if (v >= 0) { yTop = yOf(posB + v); yBot = yOf(posB); posB += v; }
            else { yTop = yOf(negB); yBot = yOf(negB + v); negB += v; }
          } else {
            gw = bwS * 0.88;
            bx = xc - bwBase / 2 + k * bwS + (bwS - gw) / 2;
            var yv = yOf(v);
            yTop = Math.min(yv, baseY);
            yBot = Math.max(yv, baseY);
          }
          var hh = Math.max(yBot - yTop, 0.8);
          out.push('<rect x="' + bx.toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + gw.toFixed(1) + '" height="' + hh.toFixed(1) + '" fill="' + col + '" data-series="' + s.si + '"' + (v < 0 ? ' data-neg="1"' : '') + '/>');
          if (state.labels) {
            var ly = stack ? (yTop + hh / 2 + 4) : (v >= 0 ? yTop - 7 : yBot + 14);
            if (!stack || hh > 18) {
              var lc = stack ? (isLight(col) ? INK : '#ffffff') : INK;
              labels.push('<text x="' + (bx + gw / 2).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" font-size="' + (stack ? 11 : 12) + '" fill="' + lc + '" data-series="' + s.si + '">' + esc(fmtNum(v)) + '</text>');
            }
          }
        });
      }
    } else if (state.type === 'line') {
      d.series.forEach(function (s, k) {
        var dy = (d.series.length > 1 && k % 2 === 1) ? 16 : -10;
        var seg = [];
        var segs = [];
        order.forEach(function (i3) {
          var v = s.values[i3];
          if (v === null || v === undefined) {
            if (seg.length) { segs.push(seg); seg = []; }
            return;
          }
          var x = useNumX ? xOf(d.xNums[i3]) : xOfCat(i3);
          seg.push(x.toFixed(1) + ',' + yOf(v).toFixed(1));
        });
        if (seg.length) { segs.push(seg); }
        segs.forEach(function (sg) {
          if (sg.length > 1) {
            out.push('<polyline points="' + sg.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-series="' + s.si + '"/>');
            out.push('<polyline points="' + sg.join(' ') + '" fill="none" stroke="#000" stroke-opacity="0" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" pointer-events="stroke" data-hit="1" data-series="' + s.si + '"/>');
          } else {
            var p = sg[0].split(',');
            out.push('<circle cx="' + p[0] + '" cy="' + p[1] + '" r="11" fill="#000" fill-opacity="0" pointer-events="all" data-hit="1" data-series="' + s.si + '"/>');
            out.push('<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.8" fill="' + s.color + '" data-series="' + s.si + '"/>');
          }
        });
        order.forEach(function (i4) {
          var v = s.values[i4];
          if (v === null || v === undefined) { return; }
          var x = useNumX ? xOf(d.xNums[i4]) : xOfCat(i4);
          var col = (state.negColor && v < 0) ? NEG : s.color;
          out.push('<circle cx="' + x.toFixed(1) + '" cy="' + yOf(v).toFixed(1) + '" r="3.1" fill="#ffffff" stroke="' + col + '" stroke-width="2" data-series="' + s.si + '"' + (v < 0 ? ' data-neg="1"' : '') + '/>');
          if (state.labels) {
            var la = 'middle', lx2 = x;
            if (x < x0 + 22) { la = 'start'; lx2 = x + 7; }
            else if (x > x1 - 22) { la = 'end'; lx2 = x - 7; }
            labels.push('<text x="' + lx2.toFixed(1) + '" y="' + (yOf(v) + dy).toFixed(1) + '" text-anchor="' + la + '" font-size="12" fill="' + INK + '" data-series="' + s.si + '">' + esc(fmtNum(v)) + '</text>');
          }
        });
      });
    } else {
      d.series.forEach(function (s, k) {
        var dy = (d.series.length > 1 && k % 2 === 1) ? 18 : -10;
        order.forEach(function (i5) {
          var v = s.values[i5];
          if (v === null || v === undefined) { return; }
          var x = useNumX ? xOf(d.xNums[i5]) : xOfCat(i5);
          var col = (state.negColor && v < 0) ? NEG : s.color;
          out.push('<circle cx="' + x.toFixed(1) + '" cy="' + yOf(v).toFixed(1) + '" r="11" fill="#000" fill-opacity="0" pointer-events="all" data-hit="1" data-series="' + s.si + '"/>');
          out.push('<circle cx="' + x.toFixed(1) + '" cy="' + yOf(v).toFixed(1) + '" r="3.6" fill="' + col + '" data-series="' + s.si + '"' + (v < 0 ? ' data-neg="1"' : '') + '/>');
          if (state.labels) {
            var sa = 'middle', lx3 = x;
            if (x < x0 + 22) { sa = 'start'; lx3 = x + 7; }
            else if (x > x1 - 22) { sa = 'end'; lx3 = x - 7; }
            labels.push('<text x="' + lx3.toFixed(1) + '" y="' + (yOf(v) + dy).toFixed(1) + '" text-anchor="' + sa + '" font-size="12" fill="' + INK + '" data-series="' + s.si + '">' + esc(fmtNum(v)) + '</text>');
          }
        });
      });
    }

    out.push(labels.join(''));
    out.push(noteBlock(noteLines, x0, W, H, noteH));
    out.push('</svg>');
    return out.join('');
  }

  function arcSlice(cx, cy, r, a0, a1, fill, idx) {
    var at = ' data-pie="' + idx + '"';
    if (a1 - a0 >= Math.PI * 2 - 1e-6) {
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="#ffffff" stroke-width="1.5"' + at + '/>';
    }
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    return '<path d="M ' + cx + ' ' + cy + ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
      ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
      ' Z" fill="' + fill + '" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"' + at + '/>';
  }

  function drawPie(d, W, H, noteLines, noteH) {
    var s = d.series[0];
    var pairs = [];
    for (var i = 0; i < d.labels.length; i++) {
      if (s.values[i] === null || s.values[i] === undefined) { continue; }
      pairs.push({ label: d.labels[i], v: s.values[i], li: i });
    }
    if (!pairs.length) { return emptySvg(); }
    var total = 0;
    pairs.forEach(function (p) { total += Math.abs(p.v); });
    if (total <= 0) { return emptySvg(); }

    var hasTitle = !!state.title.trim();
    var top = (hasTitle ? 54 : 24);
    var cx = W / 2;
    var cy = top + (H - noteH - top) / 2;
    var r = Math.min(W * 0.26, (H - noteH - top) * 0.33);

    var out = [svgOpen(W, H)];
    if (hasTitle) {
      out.push('<text x="' + (W / 2) + '" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="' + INK + '">' + esc(state.title) + '</text>');
    }
    var a0 = -Math.PI / 2;
    pairs.forEach(function (p, i2) {
      var frac = Math.abs(p.v) / total;
      var a1 = a0 + frac * Math.PI * 2;
      out.push(arcSlice(cx, cy, r, a0, a1, pieColor(p.li), p.li));
      var mid = (a0 + a1) / 2;
      var lx = cx + Math.cos(mid) * r * 1.07;
      var ly = cy + Math.sin(mid) * r * 1.07 + 4;
      var anchor = Math.cos(mid) >= 0 ? 'start' : 'end';
      var label = p.label + ' ' + (frac * 100).toFixed(1) + '%';
      if (state.labels) { label += '（' + fmtNum(p.v) + '）'; }
      out.push('<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" font-size="12" fill="' + INK + '">' + esc(label) + '</text>');
      a0 = a1;
    });
    out.push(noteBlock(noteLines, W / 2 - 300, W, H, noteH));
    out.push('</svg>');
    return out.join('');
  }

  function markHover(info) {

    var nodes = svg.querySelectorAll('[data-series],[data-pie]');

    for (var i = 0; i < nodes.length; i++) {

  }

  function parseBlock(text) {
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n')
      .map(function (l) { return l.trim(); })
      .filter(function (l) { return l !== ''; });
    if (lines.length < 2) { return null; }
    var rows = lines.map(function (l) {
      return l.split(/\t|,|;|\s{2,}/).map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; });
    });
    var C = rows[0].length;
    if (C < 2) { return null; }
    for (var i = 0; i < rows.length; i++) { if (rows[i].length !== C) { return null; } }
    return rows;
  }

  function applyBlock(rows) {
    var head = rows[0];
    var body = rows.slice(1);
    var names = null;
    var dataRows = body;
    if (body.length >= 2) {
      var nameLike = true;
      for (var j = 1; j < head.length; j++) { if (parseValue(head[j]).v !== null) { nameLike = false; break; } }
      var numericBody = body.filter(function (r) {
        for (var k = 1; k < r.length; k++) { if (parseValue(r[k]).v === null) { return false; } }
        return true;
      }).length;
      if (nameLike && numericBody >= body.length * 0.8) { names = head; dataRows = body; }
    }
    if (!names) {
      var okNumeric = rows.filter(function (r) {
        for (var k2 = 1; k2 < r.length; k2++) { if (parseValue(r[k2]).v === null) { return false; } }
        return true;
      }).length;
      if (okNumeric < rows.length * 0.8) { return false; }
      dataRows = rows;
    }

    var cols = head.length - 1;
    var xs = dataRows.map(function (r) { return r[0]; });
    var newSeries = [];
    for (var c = 0; c < cols; c++) {
      var nm = names ? names[c + 1] : (state.series[c] && state.series[c].name) || ('系列 ' + (c + 1));
      var it2 = { name: nm, text: dataRows.map(function (r) { return r[c + 1]; }).join('\n') };
      if (state.series[c] && state.series[c].color) { it2.color = state.series[c].color; }
      newSeries.push(it2);
    }

    state.xText = xs.join('\n');
    state.series = newSeries;
    document.getElementById('xText').value = state.xText;
    renderSeriesList();
    save();
    draw();
    return true;
  }

    e.preventDefault();

  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function fileBase() {
    var t = (state.title || 'chart').trim().replace(/[\\/:*?"<>|]/g, '_');
    return t || 'chart';
  }

  function svgString() {
    var clean = lastSvg
      .replace(/<(polyline|rect|circle|path)\b[^>]*\sdata-hit="1"[^>]*\/>/g, '')
      .replace(/\sdata-(?:series|pie|neg|hit)="[^"]*"/g, '');
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + clean;
  }

  document.getElementById('svg').addEventListener('click', function () {
    if (!lastSvg) { return; }
    download(new Blob([svgString()], { type: 'image/svg+xml;charset=utf-8' }), fileBase() + '.svg');
    toast('已导出 SVG');
  });

  function toPngBlob(scale) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var blob = new Blob([svgString()], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = lastW * scale;
        c.height = lastH * scale;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('toBlob failed')); }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('svg load failed')); };
      img.src = url;
    });
  }

  document.getElementById('png').addEventListener('click', function () {
    if (!lastSvg) { return; }
    toast('正在生成…');
    toPngBlob(parseInt(state.scale, 10) || 3).then(function (b) {
      download(b, fileBase() + '.png');
      toast('已导出 PNG');
    }).catch(function () { toast('导出失败，请改用 SVG'); });
  });

  document.getElementById('copy').addEventListener('click', function () {
    if (!lastSvg) { return; }
    toPngBlob(parseInt(state.scale, 10) || 3).then(function (b) {
      if (!navigator.clipboard || !window.ClipboardItem) { throw new Error('unsupported'); }
      return navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
    }).then(function () {
      toast('已复制到剪贴板');
    }).catch(function () {
      toast('当前浏览器不支持复制，请用导出 PNG');
    });
  });

  renderSeriesList();
  draw();
})();
</script>
</body>
</html>
